T_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,d1={key:!0,ref:!0,__self:!0,__source:!0};function Ts(e,n,t){var r,l={},u=null,o=null;t!==void 0&&(u=""+t),n.key!==void 0&&(u=""+n.key),n.ref!==void 0&&(o=n.ref);for(r in n)s1.call(n,r)&&!d1.hasOwnProperty(r)&&(l[r]=n[r]);if(e&&e.defaultProps)for(r in n=e.defaultProps,n)l[r]===void 0&&(l[r]=n[r]);return{$$typeof:c1,type:e,key:u,ref:o,props:l,_owner:f1.current}}var Pi=p1,A=Ts,P=Ts;var ji=[{n:1,title:"El peso que no se ve",subtitle:"Lo que cargamos sin nombrarlo",paragraphs:["Hay pesos que no se ven en una fotografía. No están en los hombros, aunque duelan los hombros. Están en la manera de entrar a una habitación, en la respiración corta antes de responder un mensaje, en la costumbre de sonreír mientras por dentro se sostiene algo que ya no cabe.","Soltar no empieza con una frase bonita. Empieza con una honestidad pequeña: esto me pesa. No porque sea débil quien lo carga, sino porque es humano quien lo ha llevado demasiado tiempo sin soltarlo ni mirarlo de frente.","La gracia no llega para regañarnos por haber cargado tanto. Llega para decirnos que no tenemos que seguir cargando lo que ya no nos corresponde. Que hay una manera más liviana de vivir, y que esa manera también es fe.","Si hoy estás cansado, no te pidas más fuerza. Pídete verdad. Nombra lo que pesa. Ponlo sobre la mesa, frente a Dios, frente a ti. Lo que se nombra puede ser entregado; lo que se esconde sigue mandando en silencio.","Respira. No tienes que resolver tu vida en este capítulo. Solo tienes que permitirte empezar. Soltar es, primero, dejar de fingir que no duele."]},{n:2,title:"Lo que no fue",subtitle:"El duelo por la vida que imaginamos",paragraphs:["Hay duelos que nadie acompaña porque no hubo funeral. El duelo por lo que no fue: la conversación que no llegó, la relación que no se salvó, el sueño que se quedó a mitad de camino. Duele igual, aunque nadie lo llame pérdida.","Nos quedamos revisando el pasado como si pudiéramos editarlo. Si hubiera dicho esto. Si hubiera llegado antes. Si no hubiera confiado tanto. Y en esa revisión infinita, el presente se nos va de las manos.","Soltar lo que no fue no es negar que importó. Es aceptar que la historia tomó otro camino y que tú sigues aquí, con vida, con capacidad de elegir lo que viene. Lo que no fue no te define. Lo que haces con lo que sí es, sí.","Hoy puedes escribir una frase que te devuelva el presente: Esto no sucedió, y aun así mi vida sigue teniendo sentido. No es resignación. Es la puerta por donde vuelve la paz.","La gracia no reescribe el pasado para que duela menos. Te acompaña a mirarlo sin que te trague. Y un día, sin darte cuenta, dejas de visitar esa habitación todos los días."]},{n:3,title:"El apego disfrazado de amor",subtitle:"Cuando sostener hace más daño que soltar",paragraphs:["Hay apegos que se visten de amor. Decimos te amo, pero en realidad decimos no me dejes. Decimos me preocupo por ti, pero en realidad decimos necesito controlarte para sentirme seguro. El amor que aprieta termina asfixiando lo que quería cuidar.","Amar no es poseer. Amar es desear el bien del otro, incluso cuando ese bien no nos incluye de la manera que imaginamos. Eso duele, porque nos enseñaron que si amamos mucho, la otra persona se queda. Pero el amor verdadero no retiene: acompaña, bendice y, cuando es necesario, suelta.","Pregúntate con honestidad: ¿esto que sostengo me está haciendo más libre o más temeroso? ¿Estoy amando a la persona o estoy amando la idea de no quedarme solo? La respuesta, aunque duela, es el inicio de la libertad.","Soltar a alguien no es dejar de amarlo. Es dejar de usarlo como anestesia para tu miedo. Es confiar en que si hay amor, habrá un camino sano; y si no lo hay, también habrá vida después.","Hoy puedes amar sin apretar. Puedes decir: te amo, y por eso te dejo libre. Y también puedes decirte a ti: me amo, y por eso me dejo libre a mí."]},{n:4,title:"El perdón que no llega",subtitle:"Perdonar sin justificar lo que pasó",paragraphs:["Perdonar no es decir que estuvo bien. No es olvidar, ni minimizar, ni volver a confiar de inmediato. Perdonar es negarse a seguir bebiendo el veneno esperando que le haga daño a otro.","Hay heridas que se vuelven identidad. Nos presentamos por lo que nos hicieron. Y aunque es comprensible, llega un momento en que la herida deja de ser un lugar por donde pasamos y se convierte en la casa donde vivimos.","El perdón no llega por fuerza. Llega por gracia, en capas, a veces en silencio. Un día dejas de ensayar la conversación. Otro día ya no buscas noticias de esa persona. Otro día oras por ella sin que te tiemble la voz. Así, despacio, se suelta.","No tienes que perdonar hoy si no puedes. Pero puedes empezar a desear perdonar. Puedes decir: Dios, yo no puedo, pero ayúdame a querer poder. Esa oración pequeña es más poderosa que mil intentos de fuerza de voluntad.","El perdón no libera primero al otro. Te libera a ti. Te devuelve la noche, la respiración, el futuro. Y eso también es gracia."]},{n:5,title:"La culpa que se queda",subtitle:"Cuando el error ya pasó y tú sigues castigándote",paragraphs:["La culpa sana te avisa: aquí te equivocaste, repara lo que puedas. La culpa que se queda, en cambio, te castiga después de que ya reparaste, después de que ya pediste perdón, después de que ya aprendiste. Se convierte en un juez que nunca cierra el caso.","Hay personas que ya fueron perdonadas por Dios y por otros, pero no se perdonan a sí mismas. Viven pagando una deuda que ya fue saldada, como si sufrir más los hiciera más buenos. No. Sufrir más no te hace más santo. Te hace más cansado.","Soltar la culpa no es volverte irresponsable. Es aceptar que tu error fue real, que tu aprendizaje también lo es, y que tu vida no tiene que ser un castigo permanente. La gracia no te pide que te flageles: te pide que te levantes.","Si hoy pudieras mirarte como Dios te mira, ¿qué verías? No a un caso perdido. Verías a alguien en proceso, a alguien que está aprendiendo a amar mejor, a alguien digno de una segunda oportunidad.","Escribe hoy, si puedes: ya aprendí. Ya pedí perdón. Ya no me castigo por lo mismo. Y luego, vive como quien cree eso."]},{n:6,title:"Soltar no es olvidar",subtitle:"La memoria puede quedarse sin mandar",paragraphs:["Nos da miedo soltar porque creemos que soltar es olvidar. Como si al soltar a una persona, un sueño o una etapa, estuviéramos traicionando lo que vivimos. Pero soltar no borra la historia: le cambia el lugar.","Lo que amaste seguirá siendo parte de ti. Lo que aprendiste no se pierde. Lo que dolió puede convertirse en sabiduría en lugar de herida abierta. Soltar es dejar de vivir dentro del recuerdo y empezar a vivir con el recuerdo en su lugar.","Hay recuerdos que son como fotografías: puedes mirarlos con ternura sin querer volver a vivir dentro de ellos. Puedes agradecer lo que fue, honrarlo, y seguir caminando. El agradecimiento es la forma más sana de la memoria.","Cuando extrañes, no te regañes. Di: extraño, y eso significa que amé. Y luego vuelve al presente, a la taza de café, a la conversación de hoy, a la vida que todavía te está esperando.","Soltar no es olvidar. Es recordar sin sangrar. Es dejar que el pasado sea pasado, y que el presente vuelva a ser hogar."]},{n:7,title:"El silencio que sana",subtitle:"Dejar de explicar, dejar de pelear",paragraphs:["Hay batallas que se ganan dejando de pelearlas. No toda ofensa merece respuesta. No toda opinión merece defensa. No toda persona merece acceso a tu paz. El silencio, a veces, es la forma más alta de soltar.","Nos agotamos explicándonos a quienes ya decidieron no entendernos. Queremos que el otro reconozca, que admita, que cambie. Y mientras esperamos ese reconocimiento, nuestra paz queda en manos de alguien más.","El silencio que sana no es silencio de resentimiento. Es silencio de confianza: yo ya dije lo que tenía que decir, hice lo que tenía que hacer, y ahora entrego el resto. No necesito tener la última palabra para tener paz.","Aprende a cerrar conversaciones en tu corazón aunque sigan abiertas en tu teléfono. Aprende a no responder de inmediato. Aprende a decir: esto ya no me pertenece.","En el silencio, Dios habla más bajito y más claro. Ahí, lejos del ruido, descubres que no estabas solo: estabas saturado. Y que la paz no se encuentra gritando, sino soltando."]},{n:8,title:"La casa vacía",subtitle:"Cuando la vida cambia de forma",paragraphs:["Hay una silla que ya nadie ocupa. Una rutina que ya no tiene sentido. Una casa que suena distinto. La ausencia tiene un sonido: el de lo cotidiano sin la persona, sin el proyecto, sin la etapa que se fue.","La casa vacía no se llena forzando otra cosa en el mismo lugar. Se habita de nuevo, despacio, con otros rituales, con otras luces, con otra manera de estar. No es reemplazar: es volver a hacer hogar.","Si estás en esa casa vacía, no te apresures a llenarla. Permítete el duelo. Permítete llorar en la cocina y reírte al día siguiente sin culpa. La vida no te está castigando: te está invitando a una nueva forma.","Un día, sin darte cuenta, la casa vuelve a oler a café, vuelve a tener música, vuelve a tener visitas. No porque olvidaste, sino porque aprendiste a vivir con espacio. El vacío, cuando se entrega, se convierte en lugar para lo nuevo.","Tu casa interior también puede volver a ser habitable. Empieza por una esquina: una planta, una oración, una conversación honesta. La gracia reconstruye por dentro, sin prisa y sin ruido."]},{n:9,title:"El espejo",subtitle:"Soltar la imagen que otros esperan de ti",paragraphs:["Durante años nos miramos en espejos prestados: lo que papá esperaba, lo que la pareja necesitaba, lo que la iglesia, el trabajo o la familia aplaudían. Y terminamos viviendo para una versión de nosotros que nunca nos hizo felices.","Soltar la imagen no es volverse egoísta. Es volverse honesto. Es reconocer que no puedes sostener una vida que no es la tuya, y que complacer a todos es una forma lenta de abandonarte a ti mismo.","El espejo de la gracia no te muestra lo que deberías ser. Te muestra lo que eres: amado, en proceso, suficiente para empezar de nuevo. No necesitas ser perfecto para ser digno de amor. Necesitas ser verdadero.","Hoy puedes soltar una expectativa. Una sola. Puedes decir: ya no voy a fingir que esto me hace feliz. Puedes decir: esto soy yo, y eso también merece respeto.","Cuando te mires de nuevo, no busques la aprobación de ayer. Busca la paz de hoy. Esa es la señal de que estás volviendo a ti."]},{n:10,title:"La fe en medio del duelo",subtitle:"Cuando Dios parece guardar silencio",paragraphs:["Hay momentos en que la fe no se siente. Oras y no pasa nada. Lees y no entiendes. Vas y no sientes. Y te preguntas si Dios se fue. No se fue. A veces, el silencio de Dios no es ausencia: es compañía sin palabras.","La fe en medio del duelo no es fe de certezas. Es fe de permanencia: me quedo. Me quedo aunque no entienda. Me quedo aunque duela. Me quedo porque sé que este dolor no es el final de la historia.","No tienes que tener una fe grande. Una fe pequeña, honesta, cansada, también cuenta. Un suspiro también es oración. Un te extraño, Dios también es oración. Un no puedo más, ayúdame también es oración.","Si hoy no puedes creer por ti, deja que otros crean contigo. Pide compañía. Pide oración. Pide un abrazo. La fe también se sostiene en comunidad, y pedir ayuda no es falta de fe: es fe en acción.","Un día mirarás atrás y entenderás que no fue tu fuerza lo que te sostuvo. Fue gracia. Gracia en forma de personas, de pausas, de palabras justas. Gracia que nunca te soltó, aunque tú sentías que soltabas todo."]},{n:11,title:"Volver a respirar",subtitle:"Pequeños comienzos que sí cuentan",paragraphs:["Volver a respirar no es un evento. Es una práctica. Es tomar agua, salir a caminar, abrir la ventana, contestar un mensaje, volver a reírte de algo tonto. Lo pequeño también es sagrado cuando vienes de un lugar oscuro.","No esperes a sentirte completamente bien para empezar a vivir. Vive para empezar a sentirte bien. La motivación no llega antes: llega después del primer paso, del segundo, del tercero.","Haz hoy una lista corta, no de pendientes, sino de comienzos: una llamada, una caminata, una página, una oración, una comida hecha con calma. Cada comienzo es una señal para tu corazón: todavía hay vida aquí.","Si recaes, no vuelvas a cero. Vuelves con experiencia. La recaída no borra el camino recorrido. Levántate con ternura, no con castigo. La gracia no cuenta caídas: cuenta regresos.","Respira. Inhala: recibo. Exhala: suelto. Repítelo tres veces. Eso, aunque parezca poco, es volver a elegir la vida."]},{n:12,title:"Amar sin poseer",subtitle:"El amor que deja libre también se queda",paragraphs:["Amar sin poseer es el amor más difícil y el más hermoso. Es amar a tus hijos sin hacerlos tu proyecto. Amar a tu pareja sin hacerla tu refugio único. Amar a tus amigos sin exigirles que te salven.","Cuando amamos sin poseer, dejamos de contar: cuánto di, cuánto me dieron, quién llamó primero. Empezamos a dar por gratitud, no por deuda. Y curiosamente, ese amor pesa menos y dura más.","Si amas a alguien que se fue, puedes seguir amándolo sin retenerlo. Puedes bendecir su camino y seguir el tuyo. El amor no se acaba porque la relación cambió de forma. Se transforma, se aquieta, se vuelve oración.","Y si amas a alguien que está aquí, ámalo hoy, sin posponerlo para cuando seas mejor, para cuando tengas más, para cuando haya menos miedo. El amor de hoy es el único que tenemos garantizado.","Amar sin poseer es decir: eres libre, y yo también. Y desde esa libertad, elijo quedarme, elijo cuidar, elijo amar. Ese amor no encadena: libera."]},{n:13,title:"La gracia de empezar de nuevo",subtitle:"No es tarde para una vida más liviana",paragraphs:["Empezar de nuevo no significa borrar todo. Significa comenzar desde donde estás, con lo que tienes, con lo que aprendiste. No necesitas una vida nueva: necesitas una relación nueva con tu vida.","La gracia de soltar no te promete una vida sin dolor. Te promete una vida sin cadenas. Una vida donde el pasado no manda, donde el miedo no decide, donde el amor no aprieta, donde tú vuelves a ser protagonista.","Si llegaste hasta aquí, ya soltaste algo. Tal vez no lo notaste, pero algo se aflojó en ti. Una idea, una culpa, un nombre, un miedo. Eso es gracia en movimiento. Y eso merece celebrarse.","Hoy puedes cerrar este libro y abrir una puerta. Puedes llamar, perdonar, descansar, empezar. Puedes decir: hasta aquí llegué cargando esto. De aquí en adelante, camino más liviano.","Que la gracia te acompañe. Que sueltes lo que pesa, que abraces lo que queda, y que descubras que soltar no era perder: era volver a ti, volver a Dios, volver a la vida. Con amor, Wilfran."]}];async function Ui(e,n){let t=await fetch("actions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:e,args:n})}),r=await t.json().catch(()=>({}));if(!t.ok||r.error)throw Error(r.error||"Error "+t.status);return r.data}function q1(e,n){if(!n.trim())return e;let t=e.toLowerCase().indexOf(n.toLowerCase());if(t<0)return e;return P(Pi,{children:[e.slice(0,t),A("mark",{className:"search-mark",children:e.slice(t,t+n.length)}),e.slice(t+n.length)]})}function Hi(){let[e,n]=I.useState("light"),[t,r]=I.useState(18),[l,u]=I.useState(!1),[o,i]=I.useState("Para mi esposa con mucho amor de tu escritor favorito Wilfran"),[a,p]=I.useState("Para mi esposa con mucho amor de tu escritor favorito Wilfran"),[d,S]=I.useState(!1),[q,V]=I.useState(0),[g,m]=I.useState(!1),[N,s]=I.useState(""),[c,f]=I.useState(!1),[k,O]=I.useState(""),[j,v]=I.useState(""),[U,D]=I.useState(null),[H,xe]=I.useState(!1),[Hr,Ri]=I.useState(null),[Ps,js]=I.useState(!1),Us=I.useRef(null),Ot=I.useRef(null),wi=I.useRef(null);I.useEffect(()=>{let T=(M)=>{Ot.current=M};return window.addEventListener("beforeinstallprompt",T),()=>window.removeEventListener("beforeinstallprompt",T)},[]),I.useEffect(()=>{(async()=>{try{let Q=((await Ui("records.list",{collection:"gracia"})).
